apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/saosnsa/ece1779-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-svc:5432/$(POSTGRES_DB)"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: admin-api-key
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: sendgrid-api-key
          resources:
            requests:
              cpu: "100m" # HPA needs this to calculate utilization
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
