# This is a template for the backend secret.
# You should create a local copy with your actual secrets and apply that to the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  admin-api-key: YOUR_ADMIN_API_KEY_HERE
  sendgrid-api-key: YOUR_SENDGRID_API_KEY_HERE
